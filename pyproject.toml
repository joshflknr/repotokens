[project]
name = "repotokens"
version = "0.1.0"
description = "Count the number of LLM tokens in a repository"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "tiktoken>=0.14.0",
]

[project.scripts]
repotokens = "repotokens.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"